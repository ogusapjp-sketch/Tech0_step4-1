[tool.pytest.ini_options]
pythonpath = ["."]
# 結合テスト（tests/integration）は Docker 起動後に明示して実行する（tests/integration/run_all.sh）
testpaths = ["tests/unit"]
markers = [
    "ttl5: ACCESS_TOKEN_TTL_SECONDS=5 で起動した環境が必要（IT-05）",
    "realtime: TEST_FIXED_NOW を未設定にして起動した環境が必要（IT-33）",
    "dbpause: MySQL コンテナを一時停止する（IT-34）。他のテストと同時に実行しない",
]

[tool.coverage.run]
branch = true
source = ["app"]
# DB に接続するコード（接続・リポジトリ）は単体テストのカバレッジ対象外とし、結合テストで確認する（人間が決定）
omit = ["*/app/db/*", "*/app/repositories/*"]
